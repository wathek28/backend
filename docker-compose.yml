version: '3.8'

services:
  app:
    image: gymz-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8082"
    container_name: springboot-app
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/gymzdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=password
      - STRIPE_API_KEY=sk_test_dummy_key_for_testing_only
      - JWT_SECRET=your_jwt_secret_key_for_testing_use_a_strong_key_in_production
      - TWILIO_ACCOUNT_SID=dummy_twilio_sid_for_testing
      - TWILIO_AUTH_TOKEN=dummy_twilio_token_for_testing
      - TWILIO_PHONE_NUMBER=+12345678900
      - SERVER_PORT=8082
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gymz-network
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G

  db:
    image: mysql:8.0.42
    container_name: mysql-db
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=gymzdb
      - MYSQL_USER=gymz
      - MYSQL_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    networks:
      - gymz-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  gymz-network:
    driver: bridge
    name: gymz-network

volumes:
  mysql-data:
    driver: local