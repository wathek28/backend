name: Deploy Backend

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Download artifact
        uses: actions/download-artifact@v3
        with:
          name: app-jar

      # Ici, vous ajouteriez les étapes pour déployer sur votre serveur
      # Par exemple, via SSH ou un service comme Heroku
